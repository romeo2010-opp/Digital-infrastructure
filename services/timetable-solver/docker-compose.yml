services:
  timetable-solver:
    build: .
    ports:
      - "7317:7317"
    environment:
      TIMETABLE_SOLVER_INTERNAL_TOKEN: ${TIMETABLE_SOLVER_INTERNAL_TOKEN:-dev-timetable-solver-token}
      TIMETABLE_SOLVER_DEFAULT_TIME_LIMIT_SECONDS: ${TIMETABLE_SOLVER_DEFAULT_TIME_LIMIT_SECONDS:-20}
      TIMETABLE_SOLVER_MAX_ALTERNATIVES: ${TIMETABLE_SOLVER_MAX_ALTERNATIVES:-3}
      TIMETABLE_SOLVER_LOG_LEVEL: ${TIMETABLE_SOLVER_LOG_LEVEL:-INFO}

